# A pfSense or OPNsense firewall: its gateways (uplinks), its own load and its DHCP pools on the
# health wall, and the firewall itself in the inventory. Off until turned on under Settings > Plugins.
# It only reads: give it a read-only API key.
id: pfsense
name: pfSense / OPNsense
icon: firewall
version: "1.0.0"
floorbit: ">=0.1,<2"
description: "A pfSense or OPNsense firewall on the health wall: each gateway (uplink) with its delay and loss, the firewall's CPU and memory, and on pfSense how full each DHCP pool is. The firewall also goes into the inventory, so the firewall view knows it."
author: Floorbit
homepage: https://www.pfsense.org/
uses: [settings, http, health, inventory]
settings:
  - {key: platform, label: Firewall, type: select, default: pfsense, options: [pfsense, opnsense],
     help: "pfsense: pfSense CE or Plus with the REST API package (pfrest.org, API v2). opnsense: OPNsense's own API."}
  - {key: url, label: Firewall URL, type: url, placeholder: "https://fw.example.com",
     help: "The address of the firewall's web interface."}
  - {key: api_key, label: API key, type: secret,
     help: "pfSense: a key from System > REST API > Keys, for a user with read access. OPNsense: the key of a user's API key pair."}
  - {key: api_secret, label: API secret, type: secret, help: "OPNsense only: the secret of the API key pair."}
  - {key: name, label: Name, type: string, placeholder: "fw-01",
     help: "The firewall's name in Floorbit's inventory. Empty: the firewall's own host name."}
  - {key: pool_warn, label: DHCP pool warning (%), type: int, default: 80,
     help: "pfSense: a pool this full turns amber; at 95% it turns red."}
  - {key: verify_ssl, label: Verify TLS certificates, type: bool, default: true,
     help: "Firewalls ship with a self-signed certificate. Turn it off only on a network you trust."}
